spring.application.name=vica-hydrate

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/vica_hydrate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server
server.port=8080

# App custom properties
app.name=Vica Hydrate
app.tagline=Hydration, Elevated. Pure Alkaline Water.
app.contact.phone=+91 91744 66929
app.contact.email=info@vicahydrate.in
app.contact.address=Indore, Madhya Pradesh, India
